# CRV · CI (auditoría de pruebas #3 — la suite deja de depender de que alguien
# se acuerde de correrla; nada impide hoy mergear con la suite en rojo).
#
# Cuatro puertas, cada una con lo que puede correr un runner de GitHub:
#   1. calidad   — tipos, lint, unitarias y cobertura (rápido, bloqueante).
#   2. contratos — PostgreSQL desechable por archivo (Docker del runner).
#   3. web       — tipos y build de la SPA.
#   4. visual    — Curaduría E7/E8 real en Chromium, desktop y móvil.
#
# `npm run test:matrix` (PG 15 y 16) y `test:deepseek:real` (red + clave) no
# corren aquí a propósito: el primero es de verificación de esquema y se deja
# manual; el segundo gasta cuota real de la API.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad (tipos, lint, unitarias, cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unitarias con cobertura
        run: npm run test:coverage
      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

  contratos:
    name: Contratos (PostgreSQL desechable)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Cada archivo de test/contract levanta su propio postgres:16-alpine en
      # un puerto del host y lo destruye al terminar; los runners traen Docker.
      - run: npm run test:contract

  web:
    name: Web (tipos y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web


  visual-curation:
    name: Curaduría visual (desktop y móvil)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: QA visual E7/E8
        run: npm run test:visual-curation
      - name: Subir capturas de Curaduría
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: curaduria-ui-qa
          path: docs/ui-qa/curaduria/
          retention-days: 14
          if-no-files-found: warn
